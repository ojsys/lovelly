[project]
name = "lovelly-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "channels[daphne]>=4.2",
    "channels-redis>=4.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "django-storages[s3]>=1.14",
    "sentry-sdk[django]>=2.0",
    "phonenumbers>=8.13",
    "pyjwt[crypto]>=2.9",
    "uvicorn[standard]>=0.32",
    "livekit-api>=1.0",
    "pillow>=11",
    "livekit>=1.0",
    "google-auth>=2.30",
    "requests>=2.32",
    "app-store-server-library>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "websockets>=13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lovelly.settings.test"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

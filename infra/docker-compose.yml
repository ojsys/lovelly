name: korram

# Host ports are offset (5433, 6380, 8100, 5174) to avoid clashing with local Postgres,
# Redis and dev servers. Inside the network services use their standard ports.

x-backend: &backend
  build: ../backend
  env_file: .env
  volumes:
    - ../backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports: ["5433:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Community MinIO images are no longer published; Chainguard builds MinIO from source.
  minio:
    image: cgr.dev/chainguard/minio@sha256:2915cb406f38ed6ff9634de0a3e4a9423e2dda06a6f1aca18f8c968aa37a01f6
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: .env
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  livekit:
    image: livekit/livekit-server:v1.8.4
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "127.0.0.1"]
    env_file: .env
    volumes: [./livekit.yaml:/etc/livekit.yaml:ro]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]

  api:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py ensure_buckets &&
             python manage.py runserver 0.0.0.0:8000"
    ports: ["8100:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(urllib.request.urlopen('http://localhost:8000/api/v1/health').status != 200)"]
      interval: 5s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend
    command: ["celery", "-A", "korram", "worker", "-l", "info"]

  beat:
    <<: *backend
    command: ["celery", "-A", "korram", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]

  matcher:
    <<: *backend
    command: ["python", "manage.py", "run_matcher"]

  admin:
    image: node:22-alpine
    working_dir: /admin
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ../admin:/admin
      - admin-node-modules:/admin/node_modules
    ports: ["5174:5173"]
    depends_on: [api]

volumes:
  postgres-data:
  minio-data:
  admin-node-modules:

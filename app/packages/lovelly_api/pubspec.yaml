name: lovelly_api
description: Dart client for the Lovelly API, generated from the OpenAPI schema.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0

dependencies:
  dio: ^5.8.0
  json_annotation: ^4.9.0
  retrofit: 4.9.0 # 4.10 adds a parser retrofit_generator 10.2 cannot compile

# Code generators live here, not in the app: their protobuf version would otherwise
# conflict with livekit_client's.
dev_dependencies:
  build_runner: ^2.7.1
  json_serializable: ^6.11.2
  retrofit_generator: 10.1.4 # must match retrofit 4.9 (10.2 targets retrofit 4.10)
  swagger_parser: ^1.45.0

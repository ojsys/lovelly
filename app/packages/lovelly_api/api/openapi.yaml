      type: object
      properties:
        store:
          $ref: '#/components/schemas/StoreEnum'
        product_id:
          type: string
          minLength: 1
          maxLength: 60
        token:
          type: string
          minLength: 1
          description: 'Google: the purchase token. Apple: the StoreKit 2 signed transaction
            (JWS).'
      required:
      - product_id
      - store
      - token

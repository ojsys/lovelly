      properties:
        gender:
          type: integer
          description: per gender-filtered match that connects
        region:
          type: integer
          description: per region-filtered match that connects
        rematch:
          type: integer
          description: per rematch that connects
      required:
      - gender
      - region
      - rematch
    ProviderEnum:
      enum:
      - google
      - apple

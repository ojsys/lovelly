          type: string
          minLength: 1
          description: 'Google: the purchase token. Apple: the StoreKit 2 signed transaction.'
      required:
      - product_id
      - store
      - token
    Prices:
      type: object
      description: Coins per use (MN-7, 12's pay-as-you-go table). Never hard-coded

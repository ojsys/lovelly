      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        cost:
          type: integer
          description: Coins taken when the match has run 5 s
        free_reason:
          type: string
          nullable: true
          description: plus | no_filters
        balance:
          type: integer
        available:
          type: integer
          description: Balance minus coins on hold
        spent_today:
          type: integer
        daily_cap:
          type: integer
          description: 0 = no cap
        cap_left:
          type: integer
          nullable: true
        can_pay:
          type: boolean
        reason:
          type: string
          nullable: true
          description: payg_off | cap_reached | low_balance
        auto_topup:
          type: boolean
      required:
      - auto_topup
      - available
      - balance
      - can_pay
      - cap_left
      - cost
      - daily_cap
      - free_reason
      - lines
      - reason
      - spent_today

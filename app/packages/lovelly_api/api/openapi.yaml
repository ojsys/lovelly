components:
  schemas:
    AccountStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        suspended_until:
          type: string
          format: date-time
          nullable: true
        notices:
          type: array
          items:
            $ref: '#/components/schemas/Notice'
      required:
      - notices
      - status
      - suspended_until
    ApiError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        retry_after:
          type: integer
      required:
      - code
      - detail
    BasicsRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 40
        dob:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        adult_confirmed:
          type: boolean
      required:
      - adult_confirmed
      - dob
      - first_name
      - gender
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    BlockRequestRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Blocks the other person in this session
      required:
      - session_id
    ChannelEnum:
      enum:
      - sms
      - voice
      type: string
      description: |-
        * `sms` - sms
        * `voice` - voice
    ChatHistory:
      type: object
      properties:
        friend:
          $ref: '#/components/schemas/FriendSummary'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        more:
          type: boolean
      required:
      - friend
      - messages
      - more
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        body:
          type: string
        kind:
          type: string
        sent_at:
          type: string
          format: date-time
        seen_at:
          type: string

          allOf:
          - $ref: '#/components/schemas/DailyCapEnum'
          description: |-
            0 = no cap

            * `50` - 50
            * `100` - 100
            * `200` - 200
            * `0` - 0
        auto_topup:
          type: boolean
        topup_pack:
          type: string
          readOnly: true
        plus:
          allOf:
          - $ref: '#/components/schemas/PlusStatus'
          readOnly: true
        prices:
          allOf:
          - $ref: '#/components/schemas/Prices'

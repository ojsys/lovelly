name: korram
description: "Korram — random video, voice and text chats with verified people."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  korram_api:
    path: packages/korram_api
  camera: ^0.11.2+1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.2.3
  go_router: ^17.0.0
  google_sign_in: ^7.2.0
  livekit_client: 2.6.4 # newest that Flutter 3.32 allows (2.6.5+ needs meta 1.17)
  permission_handler: ^12.0.1
  sign_in_with_apple: ^7.0.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/DMSans-OFL.txt

  # Static instances cut from the OFL variable fonts (licences alongside).
  # Bricolage Grotesque: opsz 32, wdth 100. DM Sans: opsz 14.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700

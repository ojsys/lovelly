openapi: 3.0.3
info:
  title: Korram API
  version: 1.0.0
paths:
  /api/v1/auth/otp/request:
    post:
      operationId: auth_otp_request_create
      description: 'FR-1: text or call a 6-digit code. Signed-in Google/Apple users
        use this too (FR-2).'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/otp/verify:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/social:
    post:
      operationId: auth_social_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialSignInRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/blocks:
    post:
      operationId: blocks_create
      description: 'SF-5: block the other person in a session.'
      tags:
      - blocks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Block'
          description: ''
  /api/v1/blocks/{block_id}:
    delete:
      operationId: blocks_destroy
      parameters:
      - in: path
        name: block_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - blocks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/health:
    get:
      operationId: health_retrieve
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/match/online-count:
    get:
      operationId: match_online_count_retrieve
      description: 'FR-9: live count of people online.'
      tags:
      - match
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlineCount'
          description: ''
  /api/v1/me/basics:
    put:
      operationId: me_basics_update
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BasicsRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationState'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/profile:
    get:
      operationId: me_profile_retrieve
      description: Read-only summary for Home and Matching; editing arrives with Profile
        (M5).
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
          description: ''
  /api/v1/me/selfie:
    post:
      operationId: me_selfie_create
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelfieRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationState'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/me/verification:
    get:
      operationId: me_verification_retrieve
      tags:
      - me
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationState'
          description: ''
  /api/v1/sessions/{session_id}:
    get:
      operationId: sessions_retrieve
      description: A session the user took part in, with its messages (to resume after
        a reconnect).
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sessions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
          description: ''
components:
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        retry_after:
          type: integer
      required:
      - code
      - detail
    BasicsRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 40
        dob:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        adult_confirmed:
          type: boolean
      required:
      - adult_confirmed
      - dob
      - first_name
      - gender
    Block:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    BlockRequestRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
          description: Blocks the other person in this session
      required:
      - session_id
    ChannelEnum:
      enum:
      - sms
      - voice
      type: string
      description: |-
        * `sms` - sms
        * `voice` - voice
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        body:
          type: string
        kind:
          type: string
        sent_at:
          type: string
          format: date-time
        seen_at:
          type: string
          format: date-time
          nullable: true
        flagged:
          type: boolean
        flag_reason:
          type: string
      required:
      - body
      - flag_reason
      - flagged
      - id
      - kind
      - seen_at
      - sender_id
      - sent_at
    GenderEnum:
      enum:
      - woman
      - man
      - other
      type: string
      description: |-
        * `woman` - Woman
        * `man` - Man
        * `other` - Other
    Health:
      type: object
      properties:
        status:
          type: string
        db:
          type: boolean
        redis:
          type: boolean
      required:
      - db
      - redis
      - status
    Interest:
      type: object
      properties:
        slug:
          type: string
        label:
          type: string
      required:
      - label
      - slug
    MyProfile:
      type: object
      properties:
        first_name:
          type: string
        age:
          type: integer
          nullable: true
        city:
          type: string
        interests:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        languages:
          type: array
          items:
            type: string
        is_verified:
          type: boolean
      required:
      - age
      - city
      - first_name
      - interests
      - is_verified
      - languages
    NextStepEnum:
      enum:
      - phone
      - basics
      - selfie
      - review
      - done
      type: string
      description: |-
        * `phone` - phone
        * `basics` - basics
        * `selfie` - selfie
        * `review` - review
        * `done` - done
    OnlineCount:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    OtpRequestRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        channel:
          allOf:
          - $ref: '#/components/schemas/ChannelEnum'
          default: sms
      required:
      - phone
    OtpRequestResponse:
      type: object
      properties:
        phone:
          type: string
          description: E.164 form of the number
        masked:
          type: string
          description: e.g. +234 803 ••• ••42
        resend_in:
          type: integer
          description: Seconds until another code may be sent
      required:
      - masked
      - phone
      - resend_in
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        code:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - code
      - phone
    Peer:
      type: object
      properties:
        first_name:
          type: string
        age:
          type: integer
          nullable: true
        city:
          type: string
        shared_interests:
          type: array
          items:
            type: string
        verified:
          type: boolean
      required:
      - age
      - city
      - first_name
      - shared_interests
      - verified
    ProviderEnum:
      enum:
      - google
      - apple
      type: string
      description: |-
        * `google` - Google
        * `apple` - Apple
    SelfieEnum:
      enum:
      - none
      - failed
      - manual_review
      - rejected
      - passed
      type: string
      description: |-
        * `none` - none
        * `failed` - failed
        * `manual_review` - manual_review
        * `rejected` - rejected
        * `passed` - passed
    SelfieRequest:
      type: object
      properties:
        pose_front:
          type: string
          format: binary
        pose_left:
          type: string
          format: binary
      required:
      - pose_front
      - pose_left
    Session:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        next_step:
          $ref: '#/components/schemas/NextStepEnum'
      required:
      - access
      - next_step
      - refresh
    SessionDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
        peer:
          $ref: '#/components/schemas/Peer'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
      required:
      - end_reason
      - ended_at
      - id
      - messages
      - mode
      - peer
      - started_at
    SocialSignInRequest:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/ProviderEnum'
        id_token:
          type: string
          minLength: 1
      required:
      - id_token
      - provider
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    VerificationState:
      type: object
      properties:
        phone_verified:
          type: boolean
        basics_done:
          type: boolean
        selfie:
          $ref: '#/components/schemas/SelfieEnum'
        attempts_left:
          type: integer
        is_verified:
          type: boolean
        next_step:
          $ref: '#/components/schemas/NextStepEnum'
      required:
      - attempts_left
      - basics_done
      - is_verified
      - next_step
      - phone_verified
      - selfie
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
